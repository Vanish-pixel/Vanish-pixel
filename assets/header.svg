<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Vanish-pixel — building modern tools, communities and infrastructure">
  <title>Vanish-pixel</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04120E"/>
      <stop offset="0.55" stop-color="#06231B"/>
      <stop offset="1" stop-color="#041A14"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.16" cy="0.05" r="0.85">
      <stop offset="0" stop-color="#0E7A5A" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#0E7A5A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="0.92" cy="1" r="0.7">
      <stop offset="0" stop-color="#F8E7C9" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#F8E7C9" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8E7C9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F8E7C9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F8E7C9" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8E7C9" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F8E7C9" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#F8E7C9" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <clipPath id="card">
      <rect x="1" y="1" width="898" height="238" rx="20"/>
    </clipPath>

    <clipPath id="typeClip">
      <rect x="44" y="146" height="26" width="4">
        <animate attributeName="width"
                 values="4;524;524;4"
                 keyTimes="0;0.45;0.9;1"
                 dur="11s"
                 repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="898" height="238" rx="20" fill="url(#bg)"/>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="900" height="240" fill="url(#grid)"/>
    <rect x="0" y="0" width="900" height="240" fill="url(#glow)"/>
    <rect x="0" y="0" width="900" height="240" fill="url(#glow2)"/>

    <!-- top edge highlight + slow shimmer sweep -->
    <rect x="0" y="1" width="900" height="1.5" fill="url(#rule)"/>
    <rect x="-220" y="1" width="220" height="1.5" fill="url(#sweep)">
      <animate attributeName="x" values="-220;900" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- eyebrow -->
    <circle cx="52" cy="49" r="3.5" fill="#3FB98A">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="66" y="53" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5"
          font-weight="600" letter-spacing="2.6" fill="#F8E7C9" fill-opacity="0.62">
      DEVELOPMENT &#183; INFRASTRUCTURE &#183; COMMUNITY
    </text>

    <!-- wordmark -->
    <text x="48" y="118" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52"
          font-weight="700" letter-spacing="-0.5">
      <tspan fill="#F8E7C9">Vanish</tspan><tspan fill="#3FB98A">-pixel</tspan>
    </text>

    <!-- typed tagline -->
    <g clip-path="url(#typeClip)">
      <text x="48" y="164" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace"
            font-size="15.5" fill="#CFE9DC" fill-opacity="0.88"
            textLength="520" lengthAdjust="spacingAndGlyphs">
        Building modern tools, communities and infrastructure.
      </text>
    </g>
    <rect y="149" width="2" height="19" rx="1" fill="#F8E7C9">
      <animate attributeName="x"
               values="48;568;568;48"
               keyTimes="0;0.45;0.9;1"
               dur="11s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity"
               values="1;1;0;0;1"
               keyTimes="0;0.49;0.5;0.99;1"
               dur="1.1s"
               repeatCount="indefinite"/>
    </rect>

    <!-- chips -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.6">
      <rect x="48" y="192" width="96" height="28" rx="14" fill="#07281E" stroke="#12563F" stroke-width="1"/>
      <text x="96" y="210" text-anchor="middle" fill="#F8E7C9" fill-opacity="0.82">Web Apps</text>

      <rect x="156" y="192" width="112" height="28" rx="14" fill="#07281E" stroke="#12563F" stroke-width="1"/>
      <text x="212" y="210" text-anchor="middle" fill="#F8E7C9" fill-opacity="0.82">Discord Bots</text>

      <rect x="280" y="192" width="118" height="28" rx="14" fill="#07281E" stroke="#12563F" stroke-width="1"/>
      <text x="339" y="210" text-anchor="middle" fill="#F8E7C9" fill-opacity="0.82">Linux Servers</text>

      <rect x="410" y="192" width="106" height="28" rx="14" fill="#07281E" stroke="#12563F" stroke-width="1"/>
      <text x="463" y="210" text-anchor="middle" fill="#F8E7C9" fill-opacity="0.82">Automation</text>
    </g>

    <!-- quiet corner brackets -->
    <g stroke="#F8E7C9" stroke-opacity="0.14" stroke-width="1.2" fill="none" stroke-linecap="square">
      <path d="M838 40h22v22"/>
      <path d="M862 200h-22v-22"/>
    </g>
  </g>

  <rect x="1" y="1" width="898" height="238" rx="20" fill="none" stroke="#10513C" stroke-width="1.5"/>
</svg>
